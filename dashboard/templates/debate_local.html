{% extends "base.html" %}
{% block title %}Debate Local{% endblock %}
{% block content %}
<div x-data="debateLocalState()" x-cloak>
  <h2 class="text-2xl md:text-4xl font-bold mb-1">🎙️ Debate Local</h2>
  <p class="text-zinc-500 text-sm mb-4">Gere debates e podcasts via <strong class="text-purple-400">Ollama</strong> (modelo local, sem API)</p>

  <!-- Cards de Status -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
    <div class="bg-zinc-900 p-4 rounded-2xl">
      <p class="text-zinc-500 text-xs">🦙 Ollama</p>
      <p class="text-xl font-bold mt-1" x-text="ollamaOnline ? '✅' : '❌'"></p>
      <p class="text-[10px] mt-1" :class="ollamaOnline?'text-green-400':'text-red-400'" x-text="ollamaOnline ? 'Online' : 'Offline'"></p>
    </div>
    <div class="bg-zinc-900 p-4 rounded-2xl">
      <p class="text-zinc-500 text-xs">👥 Perfis</p>
      <p class="text-xl font-bold mt-1" x-text="perfis.length"></p>
    </div>
    <div class="bg-zinc-900 p-4 rounded-2xl">
      <p class="text-zinc-500 text-xs">🧠 Modelos</p>
      <p class="text-xl font-bold mt-1" x-text="modelos.length"></p>
    </div>
    <div class="bg-zinc-900 p-4 rounded-2xl">
      <p class="text-zinc-500 text-xs">📡 Tópicos</p>
      <p class="text-xl font-bold mt-1" x-text="topicos.length"></p>
    </div>
  </div>

  <!-- Formulário Principal -->
  <div class="bg-zinc-900 rounded-2xl p-4 md:p-5 mb-5">
    <h3 class="text-base font-semibold mb-4">⚙️ Configuração</h3>

    <!-- Seletor de Modo -->
    <div class="flex gap-2 mb-5">
      <button @click="modo='debate'" class="flex-1 px-5 py-3 rounded-xl text-sm font-semibold transition-all border-2"
              :class="modo==='debate'?'bg-emerald-600/20 border-emerald-500 text-emerald-400':'bg-zinc-800 border-zinc-700 text-zinc-400 hover:border-zinc-500'">
        <i class="fa-solid fa-comments"></i> Debate<br><span class="text-[10px] font-normal">2 pessoas do mesmo perfil</span>
      </button>
      <button @click="modo='podcast'" class="flex-1 px-5 py-3 rounded-xl text-sm font-semibold transition-all border-2"
              :class="modo==='podcast'?'bg-sky-600/20 border-sky-500 text-sky-400':'bg-zinc-800 border-zinc-700 text-zinc-400 hover:border-zinc-500'">
        <i class="fa-solid fa-microphone"></i> Podcast<br><span class="text-[10px] font-normal">Apresentador + Convidados</span>
      </button>
    </div>

    <!-- Grid de campos: tema, modelo, turnos – quebram conforme necessário -->
    <div class="flex flex-col sm:flex-row gap-3 mb-4 items-start sm:items-end">
      <!-- Tema (cresce) -->
      <div class="flex-1 w-full sm:w-auto min-w-0">
        <label class="text-xs text-zinc-500 block mb-1">🎯 Tema</label>
        <div class="flex gap-2">
          <select x-model="tema" class="flex-1 min-w-0 bg-zinc-800 text-zinc-100 rounded-xl px-3 py-2 text-sm border border-zinc-700 outline-none truncate">
            <option value="">🔀 Aleatório</option>
            <template x-for="t in topicos" :key="t"><option :value="t" x-text="t.length>50?t.slice(0,50)+'...':t"></option></template>
          </select>
          <input type="text" x-model="temaCustom" placeholder="Ou digite..." @focus="tema=''" class="flex-1 min-w-0 bg-zinc-800 text-zinc-100 rounded-xl px-3 py-2 text-sm border border-zinc-700 outline-none">
          <button @click="sortearTopico()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 px-3 rounded-xl text-xs shrink-0" title="Tópico aleatório">🎲</button>
        </div>
      </div>
      <!-- Modelo (largura fixa) -->
      <div class="shrink-0 w-full sm:w-48">
        <label class="text-xs text-zinc-500 block mb-1">🧠 Modelo</label>
        <select x-model="modelo" class="w-full bg-zinc-800 text-zinc-100 rounded-xl px-3 py-2 text-sm border border-zinc-700 outline-none truncate">
          <template x-for="m in modelos" :key="m"><option :value="m" x-text="m"></option></template>
        </select>
      </div>
      <!-- Turnos (compacto) -->
      <div class="shrink-0">
        <label class="text-xs text-zinc-500 block mb-1">🔄 Turnos</label>
        <input type="number" x-model="turnos" min="1" max="99" step="1" class="w-20 bg-zinc-800 text-zinc-100 rounded-xl px-3 py-2 text-sm border border-zinc-700 outline-none">
        <p class="text-xs text-zinc-600 mt-1 whitespace-nowrap" x-text="turnos + ' turnos = ' + (turnos*(modo==='debate'?2:(1+convidados.length))) + ' falas'"></p>
      </div>
    </div>

    <!-- Modo Debate: seleciona UM perfil -->
    <div x-show="modo==='debate'" class="mb-4">
      <label class="text-xs text-zinc-500 block mb-2">👤 Perfil dos debatedores:</label>
      <select x-model="perfil" class="w-full bg-zinc-800 text-zinc-100 rounded-xl px-3 py-2 text-sm border border-zinc-700 outline-none">
        <template x-for="p in perfis" :key="p.id">
          <option :value="p.id" x-text="p.nome + ' — ' + p.descricao"></option>
        </template>
      </select>
    </div>

    <!-- Modo Podcast: seleciona CONVIDADOS -->
    <div x-show="modo==='podcast'" class="mb-4">
      <label class="text-xs text-zinc-500 block mb-2">🎤 Convidados (selecione um ou mais):</label>
      <div class="flex flex-wrap gap-2">
        <template x-for="p in perfis" :key="p.id">
          <label class="flex items-center gap-1.5 text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-xl cursor-pointer transition-all"
                 :class="convidados.includes(p.id) ? 'ring-2 ring-sky-500 bg-zinc-700' : ''">
            <input type="checkbox" :value="p.id" x-model="convidados" class="accent-sky-500 w-3 h-3">
            <span x-text="p.nome"></span>
          </label>
        </template>
      </div>
    </div>

    <!-- Botão Gerar -->
    <button @click="gerar()" :disabled="!ollamaOnline || gerando"
            class="w-full py-3 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2"
            :class="ollamaOnline ? (modo==='debate' ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-sky-600 hover:bg-sky-500') : 'bg-zinc-700 cursor-not-allowed'">
      <i class="fa-solid" :class="gerando?'fa-spinner fa-spin':'fa-wand-magic-sparkles'"></i>
      <span x-text="gerando ? 'Gerando... (pode levar 30-60s)' : (modo==='debate' ? '🎙️ Gerar Debate' : '🎙️ Gerar Podcast')"></span>
    </button>
    <p x-show="msgErro" class="text-xs mt-2 text-red-400" x-text="msgErro"></p>
  </div>

  <!-- Resultado -->
  <div x-show="resultado" class="bg-zinc-900 rounded-2xl p-4 md:p-5">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h3 class="text-sm font-semibold" x-text="titulo||'📄 Resultado'"></h3>
        <p x-show="resultadoArquivo" class="text-[10px] text-zinc-600 mt-0.5">
          📁 <span x-text="resultadoArquivo"></span>
          <span x-show="resultadoTamanho"> • <span x-text="resultadoTamanho"></span> KB</span>
        </p>
      </div>
      <div class="flex gap-2">
        <button @click="copiar()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-400 px-3 py-1.5 rounded-lg">📋 Copiar</button>
        <button @click="salvar()" class="text-xs bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 px-3 py-1.5 rounded-lg">💾 Salvar</button>
      </div>
    </div>
    <pre class="bg-black/40 rounded-xl p-3 text-xs font-mono text-zinc-400 overflow-auto max-h-96 scrollbar-thin leading-relaxed whitespace-pre-wrap" x-text="resultado"></pre>
  </div>

  <!-- Mensagens de feedback -->
  <p x-show="msg" class="text-sm mt-3" :class="msg.startsWith('✅')?'text-emerald-400':msg.startsWith('❌')?'text-red-400':'text-zinc-400'" x-text="msg"></p>
</div>

<script>
console.log("[DEBATE_LOCAL] Página carregada");
function debateLocalState() {
  return {
    // Status
    ollamaOnline: false, modelos: [], topicos: [], perfis: [],
    // Form
    modo: 'debate', perfil: 'Jornalista', convidados: ['Cientista'],
    tema: '', temaCustom: '', turnos: 2, modelo: '',
    // Resultado
    gerando: false, msg: '', msgErro: '', resultado: '', titulo: '',
    resultadoArquivo: '', resultadoTamanho: null,

    init() {
      console.log("[DEBATE_LOCAL] Inicializando...");
      this.carregarDados();
    },

    async carregarDados() {
      // Carrega perfis
      try { const r=await fetch('/api/debate-local/perfis', {signal: AbortSignal.timeout(5000)}); if(r.ok) { const d=await r.json(); this.perfis=d.perfis||[]; } } catch(e) {}
      // Carrega modelos Ollama
      try { const r=await fetch('/api/local-generate/modelos', {signal: AbortSignal.timeout(5000)}); if(r.ok) { const d=await r.json(); this.modelos=d.modelos||[]; this.ollamaOnline=d.online||false; if(d.modelos?.length && !this.modelo) this.modelo=d.modelos[0]; } } catch(e) {}
      // Carrega tópicos
      try { const r=await fetch('/api/topicos/listar', {signal: AbortSignal.timeout(5000)}); if(r.ok) this.topicos = (await r.json()).topicos||[]; } catch(e) {}
    },

    async sortearTopico() {
      try { const r=await fetch('/api/topicos/sortear'); if(r.ok){const d=await r.json(); if(d.topico) this.temaCustom=d.topico; this.tema='';} } catch(e) {}
    },

    async gerar() {
      const temaFinal = this.temaCustom || this.tema || '';
      if (!this.ollamaOnline) { this.msgErro = '❌ Ollama offline'; return; }
      if (this.modo === 'podcast' && this.convidados.length < 1) { this.msgErro = '❌ Selecione pelo menos um convidado'; return; }

      this.gerando = true; this.msg = ''; this.msgErro = ''; this.resultado = '';
      const label = this.modo === 'debate' ? 'Debate' : 'Podcast';
      this.msg = '⏳ Gerando ' + label + (temaFinal ? ' "' + temaFinal + '"' : '') + ' via ' + this.modelo + '...';

      try {
        const r = await fetch('/api/debate-local/gerar', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            modo: this.modo,
            perfil: this.perfil,
            convidados: this.convidados,
            tema: temaFinal || undefined,
            turnos: parseInt(this.turnos) || 2,
            modelo: this.modelo
          })
        });
        const d = await r.json();
        if (r.ok && d.status === 'ok') {
          this.resultado = d.texto;
          this.titulo = '🎙️ ' + label + ' — "' + (temaFinal || 'Aleatório') + '"';
          this.resultadoArquivo = d.arquivo || '';
          this.resultadoTamanho = d.tamanho_kb || null;
          this.msg = d.mensagem || '✅ ' + label + ' gerado com sucesso!';
        } else {
          this.msgErro = d.mensagem || '❌ Erro ao gerar';
        }
        console.log("[DEBATE_LOCAL] Resultado:", d);
      } catch(e) {
        this.msgErro = '❌ ' + e.message;
        console.error("[DEBATE_LOCAL] Erro:", e);
      }
      this.gerando = false;
    },

    copiar() {
      navigator.clipboard.writeText(this.resultado).then(() => {
        this.msg = '✅ Copiado!';
        setTimeout(() => { if(this.msg==='✅ Copiado!') this.msg=''; }, 2000);
      });
    },

    async salvar() {
      try {
        const r = await fetch('/api/local-generate/salvar-texto', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ texto: this.resultado, nome: (this.modo==='debate'?'debate':'podcast')+'_'+Date.now() })
        });
        const d = await r.json();
        this.msg = d.mensagem || (r.ok ? '✅ Salvo!' : '❌ Erro ao salvar');
      } catch(e) { this.msg = '❌ ' + e.message; }
    }
  };
}
</script>
{% endblock %}
